<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Jardim com flores coloridas">
  <!-- Foto de exemplo usada quando a pessoa escolhe "Galeria" -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BDE6FB"/>
      <stop offset="1" stop-color="#E9F7FF"/>
    </linearGradient>
    <!-- Uma flor: 6 pétalas e o miolo -->
    <g id="flor">
      <ellipse cx="0" cy="-16" rx="9" ry="15"/>
      <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(60)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(120)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(180)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(240)"/>
      <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(300)"/>
    </g>
  </defs>
  <rect width="400" height="300" fill="url(#fundo)"/>
  <rect y="190" width="400" height="110" fill="#7CC36A"/>
  <path d="M0 200 Q100 175 200 198 T400 192 V300 H0 Z" fill="#5FAE52"/>

  <!-- Caules -->
  <g stroke="#2E7D32" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M60 280 V150"/>
    <path d="M130 285 V120"/>
    <path d="M205 290 V140"/>
    <path d="M275 285 V115"/>
    <path d="M345 280 V155"/>
  </g>
  <!-- Folhas -->
  <g fill="#388E3C">
    <ellipse cx="72" cy="215" rx="14" ry="6" transform="rotate(-30 72 215)"/>
    <ellipse cx="118" cy="200" rx="14" ry="6" transform="rotate(30 118 200)"/>
    <ellipse cx="217" cy="220" rx="14" ry="6" transform="rotate(-30 217 220)"/>
    <ellipse cx="263" cy="205" rx="14" ry="6" transform="rotate(30 263 205)"/>
    <ellipse cx="357" cy="225" rx="14" ry="6" transform="rotate(-30 357 225)"/>
  </g>
  <!-- Flores -->
  <use href="#flor" x="60" y="150" fill="#E91E63"/>
  <circle cx="60" cy="150" r="8" fill="#FFD54F"/>
  <use href="#flor" x="130" y="120" fill="#FF9800"/>
  <circle cx="130" cy="120" r="8" fill="#6D4C41"/>
  <use href="#flor" x="205" y="140" fill="#9C27B0"/>
  <circle cx="205" cy="140" r="8" fill="#FFD54F"/>
  <use href="#flor" x="275" y="115" fill="#FFEB3B"/>
  <circle cx="275" cy="115" r="8" fill="#6D4C41"/>
  <use href="#flor" x="345" y="155" fill="#F44336"/>
  <circle cx="345" cy="155" r="8" fill="#FFD54F"/>

  <!-- Borboleta -->
  <g transform="translate(320 60)">
    <ellipse cx="-8" cy="0" rx="9" ry="12" fill="#29B6F6"/>
    <ellipse cx="8" cy="0" rx="9" ry="12" fill="#29B6F6"/>
    <rect x="-1.5" y="-10" width="3" height="20" rx="1.5" fill="#37474F"/>
  </g>
</svg>
